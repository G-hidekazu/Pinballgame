# Required because the project uses AndroidX/Jetpack libraries (Compose, Activity, etc.).
android.useAndroidX=true
# Jetifier is not strictly needed for this Compose-only project, but keep it off by default.
android.enableJetifier=false

# Allow building on Windows paths with non-ASCII characters when relocation isn't possible.
# Recommended approach is to move the project to an ASCII-only directory (see README FAQ).
android.overridePathCheck=true

# Keep Gradle UTF-8 to avoid encoding issues on Windows paths.
org.gradle.jvmargs=-Dfile.encoding=UTF-8

# On Windows, Gradle's file system watching can leave handles open in build
# directories (e.g., OneDrive-backed paths), causing mergeDebugResources to
# fail when it tries to delete intermediate outputs. Disable the watcher to
# avoid "Unable to delete directory ... merged_res_blame_folder" errors.
org.gradle.vfs.watch=false
